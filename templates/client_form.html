{% extends "base.html" %}
{% block title %}{{ "Edit client" if is_edit else "Add client" }} | AI Business Assistant{% endblock %}
{% block content %}
  <div class="page-heading">
    <div>
      <p class="eyebrow">CLIENTS</p>
      <h1>{{ "Edit client" if is_edit else "Add a client" }}</h1>
      <p class="muted">A name and at least one contact method are required.</p>
    </div>
  </div>

  <form class="form-card" method="post">
    <div class="form-grid">
      <div class="form-field">
        <label for="name">Name <span class="required">*</span></label>
        <input id="name" name="name" type="text" maxlength="120" required
               value="{{ client.name }}" autocomplete="name">
      </div>
      <div class="form-field">
        <label for="company">Company</label>
        <input id="company" name="company" type="text" maxlength="120"
               value="{{ client.company or '' }}" autocomplete="organization">
      </div>
      <div class="form-field">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" maxlength="40"
               value="{{ client.phone or '' }}" autocomplete="tel">
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" maxlength="254"
               value="{{ client.email or '' }}" autocomplete="email">
      </div>
      <div class="form-field form-field-wide">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="5" maxlength="2000">{{ client.notes or '' }}</textarea>
      </div>
    </div>
    <div class="form-actions">
      <a class="button button-secondary" href="{{ url_for('clients') }}">Cancel</a>
      <button class="button button-primary" type="submit">{{ "Save changes" if is_edit else "Save client" }}</button>
    </div>
  </form>
{% endblock %}
